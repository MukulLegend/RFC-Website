<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Academy</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
{% include 'sidebar.html' %}
<body>

  {% include 'nav.html' %}

  <main class="about-container">
    <h1>Login</h1>
    {% include 'messages_block.html' %}
    <form method="post" style="max-width: 400px;">
      {% csrf_token %}
      <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required autofocus style="width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #cccccc; border-radius: 4px; font-size: 1rem; transition: border-color 0.3s;">
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required style="width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #cccccc; border-radius: 4px; font-size: 1rem; transition: border-color 0.3s;">
      </div>
      <button type="submit" style="background-color: #20c997; color: #ffffff; border: none; padding: 0.75rem 1.5rem; font-size: 1rem; border-radius: 4px; cursor: pointer; transition: background-color 0.3s;">Login</button>
    </form>
    <p class="mt-3">
      Not registered yet? <a href="{% url 'register' %}">Create an account here</a>.
    </p>
    <p class="mt-3">
      Forgot your password? <a href="{% url 'password_reset' %}">Reset it here</a>.
    </p>
  </main>
  <!-- Footer -->
  {% include 'footer.html' %}

</body>
</html>
