services:
  - type: web
    name: ramos-fc
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn CU.wsgi:application --workers 1 --threads 4 --timeout 60"
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL        # paste your Neon connection string
        sync: false
      - key: OPENAI_API_KEY      # paste your NEW OpenAI key
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
